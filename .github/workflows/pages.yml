name: Deploy textbook to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototypes/requirements-lock.txt

      - name: Install documentation dependencies
        run: python -m pip install -r prototypes/requirements-lock.txt

      - name: Install figure build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dvisvgm latexmk texlive-latex-extra

      - name: Generate figure assets
        run: |
          mkdir -p book/figures/generated
          cd book/figures/sources
          latexmk -pdf -interaction=nonstopmode -halt-on-error tangent-line.tex
          latex -interaction=nonstopmode -halt-on-error tangent-line.tex
          dvisvgm --no-fonts -o ../generated/tangent-line.svg tangent-line.dvi
          cp tangent-line.pdf ../generated/tangent-line.pdf

      - name: Build HTML
        run: python -m sphinx -W --keep-going -b html book book/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
