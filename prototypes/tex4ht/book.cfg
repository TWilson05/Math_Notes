\Preamble{xhtml,mathjax,3,svg}
% Load macros before the MathJax runtime, avoiding an async script race.
\Configure{MathjaxSource}{mathjax-config.js}
% Default "up" links contain nonexistent filename fragments in this toolchain.
% Use supported crosslink configuration and a stable book-home link instead.
\Configure{crosslinks*}{next}{prev}{}
\Configure{@BODY}{\HCode{<nav aria-label="Book"><a href="book.html">Book contents</a></nav>}}
\Css{body{max-width:56rem;margin:2rem auto;padding:0 1rem;line-height:1.65;font-family:Georgia,serif;color:rgb(30,42,54);}}
\Css{img{max-width:100\%;height:auto;} .mathjax-block,.mathjax-env{overflow-x:auto;} a{color:rgb(20,90,130);}}
\begin{document}
\EndPreamble
